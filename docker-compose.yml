services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: traffic
      POSTGRES_DB: traffic
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"

  app:
    build: .
    env_file:
      - .env.example
    depends_on:
      - postgres
      - mlflow
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

volumes:
  pg_data:
